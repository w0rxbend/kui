# The verdict a contributor gets on every push, and the same one the maintainers get.
#
# The pipeline is described as a sequence of stages. Each stage is a separate job here, on
# purpose: when GitHub says "style failed" the contributor already knows what to fix, whereas one
# long job called "build" only says that something, somewhere, went wrong. The jobs are independent
# and run in parallel; the sequence is a reading order, not a dependency chain.
#
# Stages whose build tasks do not exist yet are deliberately absent rather than
# stubbed. A job that always passes is worse than no job: it looks like coverage. That principle is
# also why the `test` job runs `./scripts/run-tests.sh` rather than a hand-maintained list of
# modules — a list goes stale the first time somebody adds a suite, and it goes stale silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mill and coursier both honour this; it keeps the JVM out of the runner's swap on the larger
  # link steps.
  JAVA_OPTS: -Xmx3g

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Compile every module with -Werror
        run: ./mill __.compile

  style:
    name: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      # Two separate steps, because they fail for different reasons and the fix differs:
      # `checkFormat` means "run ./mill __.reformat", `fix --check` means "there is a lint rule
      # violation you have to think about".
      - name: Check formatting (scalafmt)
        run: ./mill __.checkFormat
      - name: Check lint rules (scalafix)
        run: ./mill __.fix --check

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Check the module layering rules (ADR-041)
        run: ./mill checkArchitecture

  generated:
    name: generated documents match their sources
    runs-on: ubuntu-latest
    # Two files in the repository are generated from code and committed alongside it: the OpenAPI
    # documents (one per service plus the merged product-wide one) and the error-code table. A
    # generated file that nobody regenerates is worse than no file — an integrator reads it,
    # believes it, and builds against an API that changed three releases ago — so both checks run
    # on every push. When one fails, the fix is to run the matching generator and commit the result:
    # `./mill __.openApi` and `./mill docs.errorCodes`.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Check the committed OpenAPI documents
        run: ./mill __.openApiCheck
      - name: Check the committed error-code table
        run: ./mill docs.errorCodes --check

  test:
    name: unit + property + contract tests
    runs-on: ubuntu-latest
    # Every suite in the repository runs here, so this job is now minutes rather than seconds. The
    # backstop is against a hung Node process, not a budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # This step used to be three commands, and the first of them was
      # `./mill libs.kernel.jvm.test build-tests.test`, which ran no tests at all. Mill's `.test` is
      # a command that takes arguments, so `build-tests.test` was handed to MUnit as a test-name
      # filter; it matched nothing, every suite was reported "ignored", and the step passed green.
      # The script below names modules with Mill's selector syntax instead, which really does run
      # them all, and it prints the number of test cases it executed rather than Mill's task count.
      #
      #
      # A task that adds a test module no longer has to remember to add a line here: the script asks
      # Mill what exists.
      - name: Run every test suite
        run: ./scripts/run-tests.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: out/**/test-report.xml
          if-no-files-found: ignore

  # The interface, which is a build of its own.
  #
  # It runs without a JDK and without Mill, which is the arrangement working rather than an
  # oversight: the two halves are separate builds and each stage proves its half stands alone. A
  # frontend change that breaks nothing on the server does not wait for the Scala suites, and a
  # server change does not rebuild a browser bundle.
  frontend:
    name: frontend typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The versions in `.tool-versions`, and pnpm is exact: `frontend/package.json` names the
          # same number in `packageManager`, and pnpm 11.25 refuses to start on a Node below 22.13.
          node-version: "22.13.0"
      - name: Install pnpm
        # `npm install -g` and not corepack: the corepack bundled with this Node carries signing
        # keys npm no longer matches, and it fails with "Cannot find matching keyid" — a message
        # that sends people looking at their registry.
        run: npm install --global --no-fund --no-audit pnpm@11.25.0
      - name: Install
        run: pnpm install --frozen-lockfile
      # Before the tests, because a type error is cheaper to read than the runtime failure it turns
      # into. `vite build` transpiles without checking types, so nothing else in this job would
      # catch one.
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # The generated files are committed so that the browser's types can be read without running
      # the backend build. `--check` fails when the committed copy has drifted from the OpenAPI
      # document it is generated from, which is the only way a contract change that nobody
      # regenerated gets noticed.
      - name: The generated types are up to date
        run: |
          pnpm --filter @kui/api run generate
          git diff --exit-code packages/api/src/schema.d.ts

  # The product, in a browser, deployed the way it ships.
  #
  # It starts the quickstart — Kafka, the seeders, the gateway and the frontend image — and drives
  # the real thing. `deployment/quickstart/quickstart.sh` is the same command a person runs, which
  # is the point: a suite that started its own bespoke stack would pass against a deployment nobody
  # else can reproduce.
  #
  # This replaced a Scala Playwright suite. The reasoning is in `frontend/playwright.config.ts`, and
  # the decisive part is that repairing the old one meant adding a browser-bundle build to the Mill
  # build — putting Node and pnpm back into the half that the split exists to keep free of them.
  browser:
    name: end-to-end (browser)
    runs-on: ubuntu-latest
    # Builds two images and starts a Kafka cluster before it opens a browser. Twenty-five minutes is
    # a backstop against a hung container, not a budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install pnpm
        run: npm install --global --no-fund --no-audit pnpm@11.25.0
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # The browser Playwright drives is not in the runner image, and the library only speaks to the
      # revision it shipped with — so this installs *the* browser rather than *a* browser.
      # `--with-deps` adds the shared libraries a fresh runner does not have.
      - name: Install the pinned browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the product
        run: deployment/quickstart/quickstart.sh
      - name: Drive it
        working-directory: frontend
        run: pnpm e2e
      # The trace is the artefact that explains a browser failure without anybody reproducing it: it
      # carries the DOM, the network and a screenshot at every step. On failure only.
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          if-no-files-found: ignore
      - name: The container logs, when it was the stack rather than the screen
        if: failure()
        run: deployment/quickstart/quickstart.sh logs || true

  # The distributed stack, and what happens to it when one service stops. Not a browser test — it
  # asserts that stopping one service degrades the others in the documented way — so it stays on the
  # backend's side of the split.
  compose:
    name: distributed stack + fault isolation
    runs-on: ubuntu-latest
    # Assembles five jars and builds five container images before it runs anything. Twenty-five
    # minutes is a backstop against a hung build, not a budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # The smoke test stops one container of the distributed stack, so all five images have to
      # exist. They are built here rather than pulled: the point is to check the artefacts this
      # commit produces, and a pulled image would be somebody else's commit. Note the braces —
      # `./mill a b` passes `b` as an argument to `a` rather than running both, which is the same
      # trap that once made the test job run no tests.
      - name: Build the container images the distributed stack runs
        run: ./mill '{deployment.docker.gateway,deployment.docker.cluster,deployment.docker.topic,deployment.docker.message,deployment.docker.consumer}.docker.build'

      - name: Run the Compose fault-isolation smoke test
        run: ./deployment/compose/smoke.sh

      # The container logs, which are the only thing that explains a compose failure without
      # somebody reproducing it locally. On failure only; on success they are noise.
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-artifacts
          path: out/e2e-artifacts/**
          if-no-files-found: ignore
