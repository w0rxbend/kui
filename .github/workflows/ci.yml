# The verdict a contributor gets on every push, and the same one the maintainers get.
#
# PLAN §49 lists the pipeline as a sequence of stages. Each stage is a separate job here, on
# purpose: when GitHub says "style failed" the contributor already knows what to fix, whereas one
# long job called "build" only says that something, somewhere, went wrong. The jobs are independent
# and run in parallel; the sequence in PLAN §49 is a reading order, not a dependency chain.
#
# Stages PLAN §49 lists whose build tasks do not exist yet are deliberately absent rather than
# stubbed. A job that always passes is worse than no job: it looks like coverage. That principle is
# also why the `test` job runs `./scripts/run-tests.sh` rather than a hand-maintained list of
# modules — a list goes stale the first time somebody adds a suite, and it goes stale silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mill and coursier both honour this; it keeps the JVM out of the runner's swap on the larger
  # link steps.
  JAVA_OPTS: -Xmx3g

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Compile every module with -Werror
        run: ./mill __.compile

  style:
    name: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      # Two separate steps, because they fail for different reasons and the fix differs:
      # `checkFormat` means "run ./mill __.reformat", `fix --check` means "there is a lint rule
      # violation you have to think about".
      - name: Check formatting (scalafmt)
        run: ./mill __.checkFormat
      - name: Check lint rules (scalafix)
        run: ./mill __.fix --check

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Check the module layering rules (ADR-041)
        run: ./mill checkArchitecture

  generated:
    name: generated documents match their sources
    runs-on: ubuntu-latest
    # Two files in the repository are generated from code and committed alongside it: the OpenAPI
    # documents (one per service plus the merged product-wide one) and the error-code table. A
    # generated file that nobody regenerates is worse than no file — an integrator reads it,
    # believes it, and builds against an API that changed three releases ago — so both checks run
    # on every push. When one fails, the fix is to run the matching generator and commit the result:
    # `./mill __.openApi` and `./mill docs.errorCodes`.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Check the committed OpenAPI documents
        run: ./mill __.openApiCheck
      - name: Check the committed error-code table
        run: ./mill docs.errorCodes --check

  test:
    name: unit + property + contract tests
    runs-on: ubuntu-latest
    # Every suite in the repository runs here, so this job is now minutes rather than seconds. The
    # backstop is against a hung Node process, not a budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      # Scala.js tests are run by handing the linked JavaScript to a JavaScript engine, and the
      # engine is Node (blocker B-002). Without Node the JS half of every cross-compiled module
      # fails with `failed to start command List(node)`.
      #
      # The DOM suites additionally need the `jsdom` npm package, and it has to be installed into a
      # `node_modules` directory at the repository root rather than globally: the generated test
      # script `require`s it, and Node finds a module by walking up from the script's own directory.
      # A global install plus NODE_PATH does not work here — that combination was tried and the run
      # still failed with `Cannot find module 'jsdom'`. `--no-save` keeps CI from inventing a
      # package.json the repository does not have.
      - name: Install jsdom for the DOM test suites
        run: npm install --no-save jsdom@30.0.1

      # This step used to be three commands, and the first of them was
      # `./mill libs.kernel.jvm.test build-tests.test`, which ran no tests at all. Mill's `.test` is
      # a command that takes arguments, so `build-tests.test` was handed to MUnit as a test-name
      # filter; it matched nothing, every suite was reported "ignored", and the step passed green.
      # The script below names modules with Mill's selector syntax instead, which really does run
      # them all, and it prints the number of test cases it executed rather than Mill's task count.
      #
      # Blocker B-003 — "a Scala.js test module and any other test module in one invocation kills
      # the Scala.js side" — was the same argument-parsing confusion seen from the other end, and
      # does not reproduce with the selector form. A run of all 58 modules in one invocation is what
      # the script does.
      #
      # A task that adds a test module no longer has to remember to add a line here: the script asks
      # Mill what exists.
      - name: Run every test suite
        run: ./scripts/run-tests.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: out/**/test-report.xml
          if-no-files-found: ignore

  frontend:
    name: frontend link + bundle shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Link the frontend with the optimising linker
        run: ./mill frontend.__.fullLinkJS
      # ADR-012's lazy feature loading only exists if the linker actually emitted separate modules.
      # `uiShell` is the module that is checked, because it is the one with an entry point and
      # therefore the one the linker produces a `main.js` for; `uiKernel` is a library and has no
      # feature list of its own, so its check would skip and prove nothing.
      - name: Check the bundle shape
        run: ./mill frontend.uiShell.checkBundleShape

  e2e:
    name: end-to-end (browser)
    runs-on: ubuntu-latest
    # The slowest stage by a wide margin: it links the frontend with the optimising linker, assembles
    # five jars, builds five container images, runs the Compose fault-isolation script and drives a
    # real browser through two deployment shapes. Thirty-five minutes is a backstop against a hung
    # browser, not a budget.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # The browser Playwright drives is not in the runner image, and the library only speaks to the
      # revision it shipped with, so this installs *the* browser rather than *a* browser. Caching it
      # separately from the Mill caches, keyed on the Playwright version, is what stops every run
      # paying a 300 MB download; `versions.playwright` is the same number `build.mill` pins.
      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(./mill show versions.playwright | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # `--with-deps` installs the shared libraries a browser needs, which a fresh runner image does
      # not have. It needs root, which the GitHub-hosted runner grants through passwordless sudo;
      # Playwright escalates internally.
      - name: Install the pinned Chromium build
        run: ./mill e2e.installBrowser --with-deps

      # E2E-002 and the Compose smoke test both stop one container of the distributed stack, so all
      # five images have to exist. They are built here rather than pulled: the point of the suite is
      # to check the artefacts this commit produces, and a pulled image would be somebody else's
      # commit. Note the braces — `./mill a b` passes `b` as an argument to `a` rather than running
      # both, which is the same trap that made the test job run no tests.
      - name: Build the container images the distributed stack runs
        run: ./mill '{deployment.docker.gateway,deployment.docker.cluster,deployment.docker.topic,deployment.docker.message,deployment.docker.consumer}.docker.build'

      # The compose topology, checked before the browser suite runs. It is faster than the browser
      # suite and it fails for a different reason — a broken compose file rather than a broken
      # screen — so running it first means the log says which of the two is wrong.
      - name: Run the Compose fault-isolation smoke test
        run: ./deployment/compose/smoke.sh

      - name: Run the end-to-end suites
        run: ./mill e2e.test -v

      # The four things that explain a browser failure without anyone reproducing it: the screenshot,
      # the console, the failed requests and the server or container logs. Uploaded on failure only,
      # because on success they are noise.
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: out/e2e-artifacts/**
          if-no-files-found: ignore
