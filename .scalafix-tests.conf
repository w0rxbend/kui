# Lint and refactoring rules applied to every KUI **test** module.
#
# `.scalafix.conf` is the decision for production code and this file is the decision for test
# code; `.scalafix-pure.conf` is the third member of the same family, holding the *stricter* set
# that `libs` and every service `domain` module opt into. scalafix cannot scope a rule to a path
# from one config file, so a rule set that differs by tree lives in its own file and the modules
# that want it point at it — see `KuiTests` in `build.mill`.
#
# TD-027 widened `__.fix` and `__.checkFormat` to `test/src` for the first time. The first run over
# 499 previously ungated test sources reported **126 `DisableSyntax` violations across 57 files**,
# and none of them is a formatting question: every one is a rule that is right for production and
# wrong for a test that drives a Java API or builds a fixture. The four relaxed below are relaxed
# with their measured counts, so the next reader can re-run the gate and see whether the reason
# still holds. The other four `DisableSyntax` rules fired **zero** times over the same 499 files
# and stay on — they cost nothing and they are the ones a test has no excuse for.

rules = [
  OrganizeImports,
  DisableSyntax
]

# Byte-for-byte the production grouping. Import order is the half of the gate that test sources
# genuinely were missing, and it is the half that moved files when this landed.
OrganizeImports {
  targetDialect = Scala3
  removeUnused = false
  groupedImports = Merge
  importSelectorsOrder = SymbolsFirst
  groups = ["re:javax?\\.", "scala.", "*", "kui."]
}

DisableSyntax {
  # 48 sites. `null` is the *input under test* wherever KUI adapts a Java API that can produce it:
  # `AdminConversionsSuite` passes a null controller node to `AdminConversions.clusterDescription`
  # precisely to prove the adapter survives one, and `KeyStore.load(null, password)` is the only
  # way the JDK spells "an empty keystore". Forbidding it here would delete the assertions.
  noNulls = false
  # 47 sites. A fixture builder ends `.fold(error => throw new IllegalStateException(...), identity)`
  # because a fixture that fails validation is a bug in the test, not a value the test should carry
  # in an `Either` to every call site. Encoding it in the return type is the production rule and it
  # would push a `Left` no assertion ever reads through several hundred fixture usages.
  noThrows = false
  # 1 site. `build-tests`' `ContrastSuite` scans a stylesheet for a matching brace with a `while`
  # loop and returns the index from inside it. Filed rather than rewritten: see TD-027's row.
  noReturns = false
  # 30 sites. `java.lang.reflect.Proxy.newProxyInstance` returns `Object` and Kafka's `KafkaFuture`
  # completions are untyped; the cast is the API, not a shortcut around pattern matching.
  noAsInstanceOf = false

  # Mirrors `.scalafix.conf`: `isInstanceOf` is allowed everywhere in KUI.
  noIsInstanceOf = false
  # These three fired **zero** times across all 499 test sources, so keeping them on costs nothing
  # and they are the ones a test has no excuse for.
  noXml = true
  noFinalize = true
  noValPatterns = true
}
