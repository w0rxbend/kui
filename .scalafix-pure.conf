# The stricter rule set for modules that must hold no mutable state and no side effects:
# `libs/**` and `services/*/domain/**` (BUILD-002 scope item 3).
#
# It is the root `.scalafix.conf` plus a ban on `var`. Keep the shared half in sync by hand;
# scalafix has no include mechanism.

rules = [
  OrganizeImports,
  DisableSyntax
]

OrganizeImports {
  targetDialect = Scala3
  removeUnused = false
  groupedImports = Merge
  importSelectorsOrder = SymbolsFirst
  groups = ["re:javax?\\.", "scala.", "*", "kui."]
}

DisableSyntax {
  noNulls = true
  noThrows = true
  noReturns = true
  noAsInstanceOf = true
  noVars = true
  noXml = true
  noFinalize = true
  noValPatterns = true
}
