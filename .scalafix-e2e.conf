# The lint rules for the `e2e` module: everything the rest of KUI enforces, except `noThrows`.
#
# `DisableSyntax.noThrows` is right for production code and wrong here, and the reason is not
# convenience. A KUI service encodes its failures in the return type because a caller has to be able
# to *handle* them: a `KuiError` becomes an HTTP envelope, a degraded capability, a dimmed navigation
# entry. A test fixture has no caller of that kind. Its failures are "the browser is not open",
# "there is no jar to run", "`docker compose up` exited 1" — states in which the suite cannot
# continue and no recovery exists, and the test framework's own protocol for saying so is a thrown
# exception. Returning `Either` from a fixture would mean every suite unwrapping a value that has
# exactly one useful case, and the failure message — which is the entire point — would have to be
# re-raised at the end anyway.
#
# The alternative considered and rejected was `sys.error`, which is a `throw` the linter happens not
# to recognise. Evading a rule is worse than exempting a module from it in a file that says why.
#
# Everything else stays on, including the import ordering, `noNulls` and `noAsInstanceOf`.

rules = [
  OrganizeImports,
  DisableSyntax
]

OrganizeImports {
  targetDialect = Scala3
  removeUnused = false
  groupedImports = Merge
  importSelectorsOrder = SymbolsFirst
  groups = ["re:javax?\\.", "scala.", "*", "kui."]
}

DisableSyntax {
  noNulls = true
  noThrows = false
  noReturns = true
  noAsInstanceOf = true
  noIsInstanceOf = false
  noXml = true
  noFinalize = true
  noValPatterns = true
}
