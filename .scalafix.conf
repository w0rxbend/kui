# Lint and refactoring rules applied to every KUI module.
#
# `-Wunused:all -Werror` (build.mill) already fails the build on an unused import, so
# OrganizeImports only has to order them; asking it to remove unused ones as well would need
# `-Ywarn-unused` semantics scalafix cannot get from Scala 3 here.

rules = [
  OrganizeImports,
  DisableSyntax
]

OrganizeImports {
  targetDialect = Scala3
  removeUnused = false
  groupedImports = Merge
  importSelectorsOrder = SymbolsFirst
  groups = ["re:javax?\\.", "scala.", "*", "kui."]
}

DisableSyntax {
  noNulls = true
  noThrows = true
  noReturns = true
  noAsInstanceOf = true
  noIsInstanceOf = false
  noXml = true
  noFinalize = true
  noValPatterns = true
}
