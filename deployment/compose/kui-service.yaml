# The configuration the topic, message, consumer, schema, metrics and alerts services share in the
# distributed topology.
#
# One file for six containers, and that is deliberate. `kui-cluster.yaml` is separate because the
# cluster service reads a section nobody else does — `kui.store.*`, where KUI keeps its own state —
# and mixing that into a file the other six also mount would put settings in front of processes
# that have no business acting on them. These six, by contrast, read exactly the same things:
# where to listen, which signing keys to accept, and which Kafka clusters exist. Six identical
# copies of that would drift, and the first symptom of the drift would be one screen working and
# another not.
#
# What every file in this directory must agree about is `kui.gateway.principalKeys`. That list is
# not a gateway setting despite where it is spelled; it is the shared key set of one deployment. The
# gateway signs the `X-Kui-Principal` header with the newest key whose `notBefore` has passed, and
# every service accepts any key in the set (ADR-020). Get this wrong and every call the gateway
# makes to a service comes back 401.

kui:
  server:
    # Every network interface. The container's own address is not knowable in advance, and binding
    # 127.0.0.1 inside a container makes the process unreachable from the network it is on.
    host: "0.0.0.0"
    # The same port every KUI image uses. These are separate containers, so there is no collision,
    # and one port for every image is one less thing to remember.
    port: 8080
    basePath: "/"

  gateway:
    # The only section of `kui.gateway` these processes read. `env:KUI_PRINCIPAL_KEY` rather than a
    # literal: a secret written into a file in version control is a secret nobody can rotate and
    # everybody can read.
    principalKeys:
      - kid: "compose-1"
        key: "env:KUI_PRINCIPAL_KEY"
        notBefore: "2026-01-01T00:00:00Z"

  auth:
    type: disabled

  telemetry:
    # Uncomment together with docker-compose.observability.yml to send these processes' spans and
    # metrics to the collector, where they appear beside the gateway's under one trace id.
    # otlpEndpoint: "http://otel-collector:4317"

    # Overridden to `text` by the Compose file, because `docker compose logs` is read by a person.
    logFormat: json

    hashUserIds: true

  # `kui.topics.refreshInterval` and `kui.consumers.refreshInterval` are left at their defaults
  # (60s and 30s). They are two knobs rather than one on purpose: sweeping a cluster's topics and
  # describing every consumer group on it are different costs against different broker paths, and
  # one setting for both would mean tuning the cheap one by the expensive one. If you raise either,
  # note that `kui.topics.scrapeTimeout` is validated to be shorter than the topic interval, so a
  # value below 45s is refused at startup rather than silently accepted.

  streaming:
    # Signs the streaming cursor a browse resumes from (ADR-026) and the plan tokens that confirm a
    # destructive operation (ADR-045). It matters here and not in the all-in-one shape: a cursor or a
    # plan minted by one replica has to verify on another, and without a configured key each process
    # generates its own at startup. The visible symptom of leaving it unset behind a load balancer is
    # a confirmation dialog that will not confirm.
    # Its own variable rather than a second use of KUI_PRINCIPAL_KEY. The two secrets protect
    # different things -- one is the gateway's claim about who is calling, the other is this
    # service's claim about what it already agreed to do -- and sharing one value would mean
    # rotating the identity key silently invalidated every open confirmation dialog.
    cursorKey: "env:KUI_CURSOR_KEY"

  # Where each cluster's broker metrics are read from, keyed by cluster id.
  #
  # `measured` is named and `unmeasured` is deliberately absent. A cluster with no entry here has no
  # source, which is the common, honest and fully supported case (ADR-032): every metrics card on
  # its dashboard says it cannot measure the figure rather than drawing a zero or an empty axis.
  #
  # `http://` and not a JMX service URL, and it is not a preference: `MetricsSourceSettings.url` is
  # a `SafeUrl`, restricted to `http` and `https` by ARCHITECTURE.md §14, so
  # `service:jmx:rmi:///jndi/rmi://kafka:9999/jmxrmi` cannot be written here at all. The exporter in
  # `docker-compose.yml` is what bridges the two. See ADR-050.
  metrics:
    sources:
      measured:
        url: "http://kafka-metrics:5556/metrics"
        kind: prometheus
        callTimeout: "10s"

  # The alerts service's dials. Every value below is the shipped default, written out rather than
  # left implicit because this file is the worked example of the distributed shape and a reader
  # cannot copy a key they cannot see.
  #
  # There is no on/off switch and there deliberately is not one: every rule the alerts service runs
  # reads a fact this product already measures, so alerting is on in every deployment and the only
  # question is where the lines are drawn. The thresholds are local policy -- a log directory at
  # 80% is a quiet afternoon in one deployment and a page in another, and a consumer group that has
  # been rebalancing for five minutes is either stuck or is a large group doing what large groups
  # do -- which is exactly why they are configuration rather than constants.
  #
  # `diskUsedCriticalPercent` must stay above `diskUsedWarningPercent` or the loader refuses the
  # file at startup: a critical bound below the warning would mean the warning never fires on the
  # way past it.
  alerts:
    retention: "7d"
    evaluationInterval: "60s"
    thresholds:
      offlinePartitions: 1
      underReplicatedPartitions: 1
      rebalanceDuration: "5m"
      diskUsedWarningPercent: 80
      diskUsedCriticalPercent: 90

  # ---------------------------------------------------------------------------------------------
  # TWO CLUSTERS ON ONE BROKER, AND ONLY ONE OF THEM MEASURABLE.
  #
  # This file said `clusters: []` for three milestones, because this topology's subject is process
  # isolation rather than Kafka. M7 ended that: `smoke.sh` has to assert that a configured cluster's
  # throughput comes back `ok` with numbers in it, and no assertion about measuring something can be
  # made against nothing to measure.
  #
  # Both entries point at the same broker, and that is the point rather than a shortcut. Whether
  # KUI can measure a cluster is a fact about `kui.metrics.sources` and not about the broker:
  # `measured` has an exporter beside it and `unmeasured` does not, so one draws a series and the
  # other says in words that it cannot be measured. Those are the two answers M7's exit criterion
  # needs to see on one deployment, and until now the second was the only one anything could
  # produce — which is why a service containing no adapter at all satisfied every clause of it.
  #
  # Both name the registry `docker-compose.yml` runs, and that container is there for the same
  # reason this comment is: a configured cluster with no registry makes the schema service report
  # `not_configured` for the whole deployment, which is correct and would have meant teaching
  # `smoke.sh` to expect a different answer for one of the seven services. The check was right; the
  # deployment was incomplete.
  clusters:
    - name: "Measured"
      id: "measured"
      bootstrapServers:
        - "kafka:9092"
      # The registry beside the broker. Both clusters name it: the difference this stack is built
      # to show is about `kui.metrics.sources` and nothing else, so every other capability is the
      # same on both, and a screen behaving differently between them is a defect not a setting.
      schemaRegistry:
        url:
          - "http://schema-registry:8080/apis/ccompat/v7"
    - name: "Unmeasured"
      id: "unmeasured"
      bootstrapServers:
        - "kafka:9092"
      # The registry beside the broker. Both clusters name it: the difference this stack is built
      # to show is about `kui.metrics.sources` and nothing else, so every other capability is the
      # same on both, and a screen behaving differently between them is a defect not a setting.
      schemaRegistry:
        url:
          - "http://schema-registry:8080/apis/ccompat/v7"

  rbac: {}
